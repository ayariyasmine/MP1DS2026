
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Consommation STEG Den Den</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<h2>Consommation STEG - Den Den</h2>
<div id="tableau">La page HTML fonctionne.</div>

<script>
async function afficherExcel() {
    const resultat = document.getElementById("tableau");

    try {
        resultat.textContent = "Chargement du fichier Excel...";

        const reponse = await fetch("./Consommation-STEG-DenDen.xlsx");

        if (!reponse.ok) {
            throw new Error("Fichier Excel introuvable (erreur " + reponse.status + ").");
        }

        const donnees = await reponse.arrayBuffer();
        const classeur = XLSX.read(donnees, { type: "array" });
        const feuille = classeur.Sheets[classeur.SheetNames[0]];

        resultat.innerHTML = XLSX.utils.sheet_to_html(feuille);

    } catch (erreur) {
        resultat.textContent = "Erreur : " + erreur.message;
    }
}

afficherExcel();
</script>

</body>
</html>
