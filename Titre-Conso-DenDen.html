
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Consommation STEG Den Den</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

    <h2>Consommation STEG - Den Den</h2>
    <div id="tableau">Chargement...</div>

    <script>
        fetch("./Consommation-STEG-DenDen.xlsx")
        .then(response => {
            if (!response.ok) {
                throw new Error("Fichier Excel introuvable. Vérifie son emplacement.");
            }
            return response.arrayBuffer();
        })
        .then(data => {
            const workbook = XLSX.read(data, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];

            document.getElementById("tableau").innerHTML =
                XLSX.utils.sheet_to_html(sheet);
        })
        .catch(error => {
            document.getElementById("tableau").textContent = error.message;
        });
    </script>

</body>
</html>
